                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">

        // DOM Elements
        const tabsHeader = document.getElementById('tabs-header');
        const tabContentContainer = document.getElementById('tab-content-container');

        // State variables
        let activeTabId = contentData[0].id;
        const viewedTabs = new Set([activeTabId]);

        function renderTabs() {
            tabsHeader.innerHTML = '';
            
            contentData.forEach((data) => {
                const isActive = data.id === activeTabId;
                
                const baseClasses = 'shrink-0 w-auto md:w-full py-3 md:py-3.5 px-3.5 md:px-4 text-xs md:text-sm text-left font-bold transition-all focus:outline-none flex items-center justify-between gap-2.5 whitespace-nowrap md:whitespace-normal border-b-2 md:border-b-0 md:border-l-4';
                const activeClasses = 'bg-white text-teal border-teal shadow-sm md:shadow-none z-10';
                const inactiveClasses = 'bg-transparent text-navy border-transparent hover:bg-gray-200/60 hover:text-teal z-0';
                
                const isViewed = viewedTabs.has(data.id);
                
                // Checkmark for viewed tabs
                const checkIcon = isViewed ? `<svg class="w-4 h-4 text-green-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>` : '';
                
                const tabBtn = document.createElement('button');
                tabBtn.className = `${baseClasses} ${isActive ? activeClasses : inactiveClasses}`;
                tabBtn.setAttribute('role', 'tab');
                tabBtn.setAttribute('aria-selected', isActive);
                tabBtn.onclick = () => switchTab(data.id);
                
                tabBtn.innerHTML = `<span class="flex-1">${data.title}</span> ${checkIcon}`;
                tabsHeader.appendChild(tabBtn);
            });
            
            renderTabContent();
        }

        function renderTabContent() {
            const data = contentData.find(d => d.id === activeTabId);
            if (!data) return;
            
            tabContentContainer.innerHTML = `
                <div class="tab-content-fade flex flex-col gap-3.5">
                    <div class="relative w-full h-28 md:h-32 rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-100">
                        <img 
                            src="${data.image}" 
                            alt="${data.imageAlt || data.title}" 
                            class="w-full h-full object-cover"
                            onerror="this.onerror=null; this.src='https://placehold.co/900x250/1f2a52/00bec7?text=' + encodeURIComponent('${data.title}');"
                        />
                        <div class="absolute inset-0 bg-gradient-to-t from-navy/80 via-navy/30 to-transparent flex items-end p-3 md:p-4">
                            <div class="flex items-center gap-3">
                                <div class="bg-lightteal text-teal p-2 rounded-lg shadow-md shrink-0">
                                    ${data.icon}
                                </div>
                                <h3 class="text-base md:text-xl font-bold text-white drop-shadow-sm">${data.title}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="text-gray-700 text-sm leading-relaxed px-0.5">${data.text}</div>
                </div>
            `;
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            viewedTabs.add(tabId);
            renderTabs();
        }

        function toggleAccordion(groupPrefix, targetId) {
            const allIds = [groupPrefix + '-1', groupPrefix + '-2', groupPrefix + '-3'];
            allIds.forEach(id => {
                const contentEl = document.getElementById(id);
                const iconEl = document.getElementById('icon-' + id);
                const btnEl = document.getElementById('btn-' + id);
                if (!contentEl || !iconEl || !btnEl) return;

                if (id === targetId) {
                    const isHidden = contentEl.classList.contains('hidden');
                    if (isHidden) {
                        contentEl.classList.remove('hidden');
                        contentEl.classList.add('fade-in');
                        iconEl.classList.add('rotate-180');
                        btnEl.setAttribute('aria-expanded', 'true');
                    } else {
                        contentEl.classList.add('hidden');
                        contentEl.classList.remove('fade-in');
                        iconEl.classList.remove('rotate-180');
                        btnEl.setAttribute('aria-expanded', 'false');
                    }
                } else {
                    contentEl.classList.add('hidden');
                    contentEl.classList.remove('fade-in');
                    iconEl.classList.remove('rotate-180');
                    btnEl.setAttribute('aria-expanded', 'false');
                }
            });
        }

        // Initialize
        renderTabs();

    </script>
</body>
</html>
